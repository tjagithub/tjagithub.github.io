<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TJ Appleby</title>
  <meta name="description" content="Software tester and developer.">
  <link rel="icon" href="/favicon.png">
  <style>
    :root {
      --ink: #3b3a33;
      --ink-soft: #7a755f;
      --paper: #fbf5e4;
      --paper-edge: #e8dcb8;
      --grass-deep: #4f8f4a;
      --accent: #d0603b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font: 17px/1.55 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background: linear-gradient(#0d5aa8 0%, #3b8fd0 85%, #9cc9ee 100%) fixed;
    }
    #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    main { position: relative; z-index: 1; max-width: 40rem; margin: 0 auto; padding: 4.5rem 1.25rem 6rem; }
    h1 {
      margin: 0 0 2.5rem;
      text-align: center;
      color: #fff;
      font-size: 2.6rem;
      font-weight: 600;
      text-shadow: 0 2px 0 rgba(20, 70, 120, 0.7), 0 0 14px rgba(20, 70, 120, 0.6);
    }
    section {
      margin-bottom: 2rem;
      padding: 1.25rem 1.5rem 0.5rem;
      background: var(--paper);
      border: 1px solid var(--paper-edge);
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(40, 80, 30, 0.25), inset 0 0 0 4px rgba(255, 255, 255, 0.45);
    }
    h2 { margin: 0 0 0.25rem; color: var(--grass-deep); font-size: 1.15rem; font-style: italic; font-weight: 600; }
    h2::before { content: "\2766  "; color: var(--accent); }
    ul { margin: 0; padding: 0; list-style: none; }
    li + li { border-top: 1px dashed var(--paper-edge); }
    a { display: block; padding: 0.85rem 0; color: inherit; text-decoration: none; }
    a:hover b { color: var(--accent); }
    b { font-weight: 600; transition: color 0.2s; }
    small { float: right; color: var(--ink-soft); font-style: italic; }
    p { margin: 0.2rem 0 0; color: var(--ink-soft); font-size: 0.92rem; }
  </style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <h1>TJ Appleby</h1>

  <section>
    <h2>Extensions</h2>
    <ul id="extensions"></ul>
  </section>

  <section>
    <h2>Repositories</h2>
    <ul id="repos"></ul>
  </section>
</main>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R;
uniform float T;
uniform float uGust, uGustPeriod, uGustWidth, uSway, uBoil, uDitherEdge, uLeaf, uRustle, uRustleGust,
  uDitherTop, uDitherWarp, uCrown, uCrownN, uClump, uMist, uMistY, uCloudSpeed, uGrain, uFarH, uNearH, uFarHaze, uBillow, uCover;

float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vn(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) { float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a * vn(p); p = p * 2.03 + 17.; a *= .5; } return s; }

float worley(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  float md = 1.;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 g = vec2(x, y);
    vec2 o = vec2(h21(i + g), h21(i + g + 37.));
    md = min(md, length(g + o - f));
  }
  return md;
}

float tower(vec2 c, vec2 ctr, vec2 sz) {
  float x = c.x - ctr.x, dx = min(min(x * x, (x - 2.6) * (x - 2.6)), (x + 2.6) * (x + 2.6));
  float dy = (c.y - ctr.y) / (c.y > ctr.y ? sz.y : sz.y * .3);
  return exp(-dx / (sz.x * sz.x) - dy * dy);
}

vec2 leaf(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  float md = 9., id = 0.;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 g = vec2(x, y);
    vec2 o = vec2(h21(i + g), h21(i + g + 37.));
    float dd = length(g + o - f);
    if (dd < md) { md = dd; id = h21(i + g + 11.); }
  }
  return vec2(md, id);
}

float gustMask(vec2 p) {
  float gx = mix(-1.4, 1.4, fract(T / uGustPeriod));
  float g = exp(-pow((p.x - gx) / uGustWidth, 2.));
  return clamp(g * (.5 + .8 * fbm(vec2(p.x * 3. - T * .1, p.y * 5.))), 0., 1.);
}

float crown(float x, float seed) {
  float cx = x * uCrownN + seed, u = fract(cx) * 2. - 1., hh = h21(vec2(floor(cx), seed));
  return smoothstep(.3, .6, fbm(vec2(x * 1.3 + seed, 3.))) * (.3 + .7 * hh * hh) * sqrt(max(1. - u * u, 0.));
}

vec4 canopy(vec2 p, float H, float sc, float haze, float seed) {
  float G = gustMask(p);
  p += G * vec2(uGust, uGust * .33) * (.6 + .4 * sin(T * 2. + p.x * 8.));
  float w = worley(p * sc + seed);
  float bil = 1. - w;
  float dC = H - p.y + uClump * sqrt(max(1. - pow(w * 1.5, 2.), 0.)) + .015 * (fbm(p * 6. + seed) - .5)
           + uSway * sin(T * .6 + p.x * 18. + seed) + uCrown * (crown(p.x, seed) - .35);
  vec2 wp = floor(G * uDitherWarp * vec2(1., .33) * (.6 + .4 * sin(T * 2. + p.x * 8.)) + .5);
  float ign = fract(52.9829189 * fract(dot(gl_FragCoord.xy + wp + floor(T * uBoil) * vec2(37., 17.), vec2(.06711056, .00583715))));
  float a = smoothstep(-.005, .005, dC + (ign - .5) * uDitherEdge);
  if (a <= 0.) return vec4(0.);
  float bilL = 1. - worley((p + vec2(-.012, .016)) * sc + seed);
  vec2 lf = leaf(p * 44. + seed);
  float tone = .12 + .5 * (1. - smoothstep(0., .16, dC)) + .4 * clamp(.5 + (bil - bilL) * 5., 0., 1.)
             + (lf.y - .5) * uLeaf + (fbm(p * 8.) - .5) * .15
             + sin(T * .8 + lf.y * 37.) * (uRustle + uRustleGust * G) + (ign - .5) * uDitherTop * (.4 + .6 * (1. - smoothstep(0., .12, dC)));
  float tq = floor(clamp(tone, 0., 1.) * 5. + .5) / 5.;
  vec3 c = mix(vec3(.08, .27, .26), vec3(.18, .47, .3), smoothstep(0., .4, tq));
  c = mix(c, vec3(.6, .75, .22), smoothstep(.4, .8, tq));
  c = mix(c, vec3(.86, .9, .42), smoothstep(.8, 1., tq));
  c *= mix(.7, 1., smoothstep(0., .15, p.y));
  return vec4(mix(c, vec3(.5, .68, .8), haze), a);
}

float dens(vec2 c) {
  vec2 m = c;
  float macro = max(max(tower(m, vec2(-.55, .3), vec2(.5, .5)), tower(m, vec2(.6, .22), vec2(.55, .42))),
                    max(tower(m, vec2(.05, .08), vec2(.8, .22)), .5 * tower(m, vec2(-.1, .62), vec2(.35, .18))));
  vec2 q = c * vec2(1., 1.4);
  float base = fbm(q * 2. + T * .01);
  float bil = 1. - worley(q * 5. + base * 1.5);
  return macro + .38 * base + uBillow * bil - .08 + uCover;
}

void main() {
  vec2 uv = gl_FragCoord.xy / R;
  float asp = R.x / R.y;
  vec2 p = vec2((uv.x - .5) * asp, uv.y);

  float grain = fbm(p * 18.);
  float brush = fbm(vec2(p.x * 5. + p.y * 9., p.y * 24. - p.x * 6.));

  vec3 col = mix(vec3(.12, .52, .88), vec3(.05, .36, .74), smoothstep(.2, 1., uv.y));
  col = mix(col, vec3(.6, .8, .96), pow(1. - uv.y, 5.) * .55);
  col += (brush - .5) * .05;

  float low = smoothstep(.3, 0., uv.y) * .22;
  vec2 cp = vec2(p.x * .9 + T * uCloudSpeed, uv.y * 1.1);
  float d = dens(cp) - low + (grain - .5) * .05 + (brush - .5) * .04;
  float mask = smoothstep(.5, .545, d);
  float halo = smoothstep(.4, .52, d) * (1. - mask);
  col = mix(col, vec3(.55, .76, .95), halo * .35);

  if (mask > 0.) {
    float dd = d;
    float dd2 = dens(cp + vec2(-.03, .03)) - low;
    float s = clamp(.5 + (dd - dd2) * 16., 0., 1.);
    s = mix(s, floor(s * 5. + .5) / 5., .75);
    vec3 c = mix(vec3(.55, .65, .84), vec3(.94, .96, .99), s);
    c = mix(c, vec3(.5, .62, .84), smoothstep(.6, .9, dd) * (1. - s) * .4);
    c = mix(c, vec3(1.), smoothstep(.62, .68, dd) * s);
    c += (brush - .5) * .12 + (grain - .5) * .05;
    c = mix(c, c * vec3(.8, .85, .95), mask * (1. - smoothstep(.52, .58, d)) * .6);
    col = mix(col, c, mask);
  }

  float pu = (uv.x - .5) * 1.8;
  float hFar = .16 + .09 * exp(-pow((pu + .45) / .5, 2.)) + .03 * sin(pu * 3. + 1.);
  float hNear = .07 + .25 * exp(-pow((pu - .62) / .42, 2.)) + .07 * exp(-pow((pu + .7) / .25, 2.));
  vec4 f = canopy(p, hFar * uFarH, 9., uFarHaze, 3.);
  col = mix(col, f.rgb, f.a);
  float band = exp(-pow((uv.y - uMistY) / .1, 2.));
  float mist = smoothstep(.35, .75, fbm(vec2(p.x * 2.2 + T * .012, uv.y * 7.))) * band * uMist;
  col = mix(col, vec3(.82, .9, .96), mist);
  f = canopy(p, hNear * uNearH, 12., 0., 11.);
  col = mix(col, f.rgb, f.a);

  col *= 1. + (grain - .5) * uGrain;
  gl_FragColor = vec4(col, 1.);
}
</script>

<script>
  const extensions = [
    ['barrel-vscode', 'Barrel Bypass', 'Find barrel files (index.ts re-exports) and rewrite imports to bypass them in one click.'],
    ['cccc-vscode', 'cccc Complexity', 'Cognitive and cyclomatic complexity per function, with a project-wide hotspots view.'],
    ['wt-vscode', 'Worktrunk (wt)', 'Git worktrees in the sidebar: create, switch, merge and remove with the wt CLI.'],
  ];

  function item(href, title, tag, desc) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = href;
    const b = document.createElement('b');
    b.textContent = title;
    a.append(b);
    if (tag) {
      const s = document.createElement('small');
      s.textContent = tag;
      a.append(s);
    }
    if (desc) {
      const p = document.createElement('p');
      p.textContent = desc;
      a.append(p);
    }
    li.append(a);
    return li;
  }

  document.getElementById('extensions').append(
    ...extensions.map(([id, name, desc]) =>
      item('https://marketplace.visualstudio.com/items?itemName=TJA.' + id, name, 'VS Code', desc))
  );

  fetch('https://api.github.com/users/tjagithub/repos?per_page=100&sort=pushed')
    .then((r) => (r.ok ? r.json() : []))
    .then((repos) => {
      const skip = new Set(['tjagithub', 'tjagithub.github.io']);
      document.getElementById('repos').append(
        ...repos
          .filter((r) => !r.fork && !r.archived && !skip.has(r.name))
          .map((r) => item(r.html_url, r.name, r.language, r.description))
      );
    })
    .catch(() => {});

  const TUNE = [
    ["gust", "gust push", 0.004, 0, 0.05, 0.001],
    ["gustPeriod", "gust period (s)", 17, 4, 40, 1],
    ["gustWidth", "gust width", 0.25, 0.1, 1, 0.05],
    ["sway", "edge sway", 0.01, 0, 0.01, 0.0005],
    ["boil", "edge boil (fps)", 1.5, 0, 12, 0.5],
    ["ditherEdge", "edge dither", 0.028, 0, 0.04, 0.001],
    ["ditherTop", "top dither", 0.4, 0, 0.4, 0.01],
    ["ditherWarp", "dither gust push (px)", 6, 0, 20, 1],
    ["crown", "tree crowns", 0.12, 0, 0.3, 0.01],
    ["crownN", "crowns per unit", 5, 2, 14, 0.5],
    ["leaf", "leaf dabs", 0.13, 0, 0.6, 0.01],
    ["rustle", "rustle", 0.09, 0, 0.15, 0.005],
    ["rustleGust", "rustle in gust", 0.13, 0, 0.3, 0.01],
    ["clump", "clump size", 0.03, 0.02, 0.12, 0.005],
    ["nearH", "near trees height", 0.9, 0.5, 1.8, 0.05],
    ["farH", "far trees height", 1.8, 0.5, 1.8, 0.05],
    ["farHaze", "far haze", 0.5, 0, 1, 0.05],
    ["mist", "mist", 0.8, 0, 0.8, 0.02],
    ["mistY", "mist height", 0.11, 0.05, 0.5, 0.01],
    ["cloudSpeed", "cloud speed", 0.02, 0, 0.02, 0.001],
    ["cover", "cloud cover", 0.15, -0.15, 0.15, 0.01],
    ["billow", "cloud billow", 0.04, 0, 0.6, 0.02],
    ["grain", "paper grain", 0.2, 0, 0.2, 0.01],
    ["scale", "render scale", 0.6, 0.3, 1, 0.05],
  ];
  const tune = Object.fromEntries(TUNE.map((t) => [t[0], t[2]]));
  try { Object.assign(tune, JSON.parse(localStorage.getItem("tune") || "{}")); } catch {}

  (function scene() {
    const canvas = document.getElementById('bg');
    const gl = canvas.getContext('webgl', { antialias: false, alpha: false });
    if (!gl) return canvas.remove();

    const compile = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return canvas.remove();
    gl.useProgram(prog);

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const uR = gl.getUniformLocation(prog, 'R');
    const uT = gl.getUniformLocation(prog, 'T');
    const locs = TUNE.map((t) => [t[0], gl.getUniformLocation(prog, "u" + t[0][0].toUpperCase() + t[0].slice(1))]);
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function draw(ms) {
      gl.uniform2f(uR, canvas.width, canvas.height);
      gl.uniform1f(uT, ms / 1000);
      for (const [k, l] of locs) if (l) gl.uniform1f(l, tune[k]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (!still) requestAnimationFrame(draw);
    }
    function resize() {
      canvas.width = Math.max(1, Math.round(innerWidth * tune.scale));
      canvas.height = Math.max(1, Math.round(innerHeight * tune.scale));
      gl.viewport(0, 0, canvas.width, canvas.height);
      if (still) draw(0);
    }
    addEventListener('resize', resize);
    resize();
    if (!still) requestAnimationFrame(draw);
  })();

  if (location.search.includes("tune")) {
    const box = document.createElement("details");
    box.style.cssText = "position:fixed;right:8px;bottom:8px;z-index:9;max-height:90vh;overflow:auto;background:#000c;color:#eee;font:12px system-ui;padding:8px;border-radius:8px";
    box.open = true;
    box.innerHTML = "<summary>tune</summary>";
    const out = [];
    for (const [k, label, , min, max, step] of TUNE) {
      const row = document.createElement("label");
      row.style.cssText = "display:grid;grid-template-columns:110px 1fr 52px;gap:6px;align-items:center;margin:3px 0";
      const inp = Object.assign(document.createElement("input"), { type: "range", min, max, step, value: tune[k] });
      const val = document.createElement("span");
      val.textContent = tune[k];
      inp.oninput = () => {
        tune[k] = +inp.value;
        val.textContent = inp.value;
        localStorage.setItem("tune", JSON.stringify(tune));
        if (k === "scale") dispatchEvent(new Event("resize"));
      };
      row.append(label, inp, val);
      box.append(row);
      out.push(inp);
    }
    const btn = (text, fn) => Object.assign(document.createElement("button"), { textContent: text, onclick: fn });
    box.append(
      btn("log values", () => {
        const s = JSON.stringify(tune);
        console.log("tune", s);
        navigator.clipboard?.writeText(s);
      }),
      btn("reset", () => { localStorage.removeItem("tune"); location.reload(); })
    );
    document.body.append(box);
  }
</script>
</body>
</html>
