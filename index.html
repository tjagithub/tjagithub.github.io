<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TJ Appleby</title>
  <meta name="description" content="Software tester and developer.">
  <link rel="icon" href="/favicon.png">
  <style>
    :root {
      --ink: #3b3a33;
      --ink-soft: #7a755f;
      --paper: #fbf5e4;
      --paper-edge: #e8dcb8;
      --grass-deep: #4f8f4a;
      --accent: #d0603b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font: 17px/1.55 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background: linear-gradient(#0d5aa8 0%, #3b8fd0 85%, #9cc9ee 100%) fixed;
    }
    #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    main { position: relative; z-index: 1; max-width: 40rem; margin: 0 auto; padding: 4.5rem 1.25rem 6rem; }
    h1 {
      margin: 0 0 2.5rem;
      text-align: center;
      color: #fff;
      font-size: 2.6rem;
      font-weight: 600;
      text-shadow: 0 2px 0 rgba(20, 70, 120, 0.7), 0 0 14px rgba(20, 70, 120, 0.6);
    }
    section {
      margin-bottom: 2rem;
      padding: 1.25rem 1.5rem 0.5rem;
      background: var(--paper);
      border: 1px solid var(--paper-edge);
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(40, 80, 30, 0.25), inset 0 0 0 4px rgba(255, 255, 255, 0.45);
    }
    h2 { margin: 0 0 0.25rem; color: var(--grass-deep); font-size: 1.15rem; font-style: italic; font-weight: 600; }
    h2::before { content: "\2766  "; color: var(--accent); }
    ul { margin: 0; padding: 0; list-style: none; }
    li + li { border-top: 1px dashed var(--paper-edge); }
    a { display: block; padding: 0.85rem 0; color: inherit; text-decoration: none; }
    a:hover b { color: var(--accent); }
    b { font-weight: 600; transition: color 0.2s; }
    small { float: right; color: var(--ink-soft); font-style: italic; }
    p { margin: 0.2rem 0 0; color: var(--ink-soft); font-size: 0.92rem; }
  </style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <h1>TJ Appleby</h1>

  <section>
    <h2>Extensions</h2>
    <ul id="extensions"></ul>
  </section>

  <section>
    <h2>Repositories</h2>
    <ul id="repos"></ul>
  </section>
</main>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R;
uniform float T;

float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vn(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) { float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a * vn(p); p = p * 2.03 + 17.; a *= .5; } return s; }

float worley(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  float md = 1.;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 g = vec2(x, y);
    vec2 o = vec2(h21(i + g), h21(i + g + 37.));
    md = min(md, length(g + o - f));
  }
  return md;
}

float tower(vec2 c, vec2 ctr, vec2 sz) {
  vec2 d = (c - ctr) / vec2(sz.x, c.y > ctr.y ? sz.y : sz.y * .3);
  return exp(-dot(d, d));
}

float dens(vec2 c) {
  float x = mod(c.x + 1.3, 2.6) - 1.3;
  vec2 m = vec2(x, c.y);
  float macro = max(max(tower(m, vec2(-.55, .3), vec2(.5, .5)), tower(m, vec2(.6, .22), vec2(.55, .42))),
                    max(tower(m, vec2(.05, .08), vec2(.8, .22)), .5 * tower(m, vec2(-.1, .62), vec2(.35, .18))));
  vec2 q = c * vec2(1., 1.4);
  float base = fbm(q * 2. + T * .01);
  float bil = 1. - worley(q * 5. + base * 1.5);
  return macro + .38 * base + .3 * bil - .08;
}

void main() {
  vec2 uv = gl_FragCoord.xy / R;
  float asp = R.x / R.y;
  vec2 p = vec2((uv.x - .5) * asp, uv.y);

  float grain = fbm(p * 18.);
  float brush = fbm(vec2(p.x * 5. + p.y * 9., p.y * 24. - p.x * 6.));

  vec3 col = mix(vec3(.12, .52, .88), vec3(.05, .36, .74), smoothstep(.2, 1., uv.y));
  col = mix(col, vec3(.6, .8, .96), pow(1. - uv.y, 5.) * .55);
  col += (brush - .5) * .05;

  float low = smoothstep(.3, 0., uv.y) * .22;
  vec2 cp = vec2(p.x * .9 + T * .004, uv.y * 1.1);
  float d = dens(cp) - low + (grain - .5) * .05 + (brush - .5) * .04;
  float mask = smoothstep(.5, .545, d);
  float halo = smoothstep(.4, .52, d) * (1. - mask);
  col = mix(col, vec3(.55, .76, .95), halo * .35);

  if (mask > 0.) {
    float dd = d;
    float dd2 = dens(cp + vec2(-.03, .03)) - low;
    float s = clamp(.5 + (dd - dd2) * 16., 0., 1.);
    s = mix(s, floor(s * 5. + .5) / 5., .75);
    vec3 c = mix(vec3(.55, .65, .84), vec3(.94, .96, .99), s);
    c = mix(c, vec3(.5, .62, .84), smoothstep(.6, .9, dd) * (1. - s) * .4);
    c = mix(c, vec3(1.), smoothstep(.62, .68, dd) * s);
    c += (brush - .5) * .12 + (grain - .5) * .05;
    c = mix(c, c * vec3(.8, .85, .95), mask * (1. - smoothstep(.52, .58, d)) * .6);
    col = mix(col, c, mask);
  }

  col *= 1. + (grain - .5) * .06;
  gl_FragColor = vec4(col, 1.);
}
</script>

<script>
  const extensions = [
    ['barrel-vscode', 'Barrel Bypass', 'Find barrel files (index.ts re-exports) and rewrite imports to bypass them in one click.'],
    ['cccc-vscode', 'cccc Complexity', 'Cognitive and cyclomatic complexity per function, with a project-wide hotspots view.'],
    ['wt-vscode', 'Worktrunk (wt)', 'Git worktrees in the sidebar: create, switch, merge and remove with the wt CLI.'],
  ];

  function item(href, title, tag, desc) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = href;
    const b = document.createElement('b');
    b.textContent = title;
    a.append(b);
    if (tag) {
      const s = document.createElement('small');
      s.textContent = tag;
      a.append(s);
    }
    if (desc) {
      const p = document.createElement('p');
      p.textContent = desc;
      a.append(p);
    }
    li.append(a);
    return li;
  }

  document.getElementById('extensions').append(
    ...extensions.map(([id, name, desc]) =>
      item('https://marketplace.visualstudio.com/items?itemName=TJA.' + id, name, 'VS Code', desc))
  );

  fetch('https://api.github.com/users/tjagithub/repos?per_page=100&sort=pushed')
    .then((r) => (r.ok ? r.json() : []))
    .then((repos) => {
      const skip = new Set(['tjagithub', 'tjagithub.github.io']);
      document.getElementById('repos').append(
        ...repos
          .filter((r) => !r.fork && !r.archived && !skip.has(r.name))
          .map((r) => item(r.html_url, r.name, r.language, r.description))
      );
    })
    .catch(() => {});

  (function scene() {
    const canvas = document.getElementById('bg');
    const gl = canvas.getContext('webgl', { antialias: false, alpha: false });
    if (!gl) return canvas.remove();

    const compile = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return canvas.remove();
    gl.useProgram(prog);

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const uR = gl.getUniformLocation(prog, 'R');
    const uT = gl.getUniformLocation(prog, 'T');
    const SCALE = 0.6;
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function draw(ms) {
      gl.uniform2f(uR, canvas.width, canvas.height);
      gl.uniform1f(uT, ms / 1000);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (!still) requestAnimationFrame(draw);
    }
    function resize() {
      canvas.width = Math.max(1, Math.round(innerWidth * SCALE));
      canvas.height = Math.max(1, Math.round(innerHeight * SCALE));
      gl.viewport(0, 0, canvas.width, canvas.height);
      if (still) draw(0);
    }
    addEventListener('resize', resize);
    resize();
    if (!still) requestAnimationFrame(draw);
  })();
</script>
</body>
</html>
